<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 min-h-screen flex flex-col items-center justify-center p-4">
     <div class="navbar w-full  top-0 left-0 right-0 z-50 h-[88px] bg-transparent text-2xl text-amber-100 flex justify-between items-center px-8 shadow-md">
        
        <img src="logo.png" alt="Logo" class="logo-img w-64 object-contain">
        
        <div class="navs flex items-center">
            <ul class="flex gap-6 items-center">
                <li><a href="index.html" class=" inline-block transition-transform duration-200 hover:text-[#22D3EE] ">Home</a></li>
                <li><a href="about.html" class="inline-block transition-transform duration-200  hover:text-[#22D3EE]">About</a></li>
                <li><a href="shop.html" class="inline-block transition-transform duration-200  hover:text-[#22D3EE]">Stock</a></li>
                <li><a href="contact.html" class="inline-block text-[#22D3EE] transition-transform duration-200 hover:text-[#22D3EE]">Contact</a></li>
                <li><a href="signup.html" class="border-2 border-transparent rounded-2xl bg-[#22D3EE] text-black font-bold px-4 py-2 text-xl inline-block transition-all duration-200 hover:bg-transparent hover:border-[#22D3EE] hover:text-[#22D3EE]">Sign Up</a></li>
            </ul>
        </div>
    </div>
    <div class="w-full max-w-md mt-8 bg-slate-900/60 backdrop-blur-md border border-slate-700/50 p-8 rounded-2xl shadow-xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white tracking-wide">Create Account</h2>
            <p class="text-slate-400 mt-2 text-sm">Join us today! It only takes a minute.</p>
        </div>

        <form class="space-y-5">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-300 mb-1.5">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" 
                    class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200" required>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" 
                    class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                <input type="password" id="password" placeholder="••••••••" 
                    class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200" required>
            </div>

            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input id="terms" type="checkbox" 
                        class="w-4 h-4 text-indigo-600 bg-slate-800 border-slate-700 rounded focus:ring-indigo-500 focus:ring-offset-slate-900 transition-all duration-200" required>
                </div>
                <div class="ml-3 text-sm">
                    <label for="terms" class="text-slate-400">I agree to the <a href="#" class="text-indigo-400 hover:underline">Terms of Service</a> and <a href="#" class="text-indigo-400 hover:underline">Privacy Policy</a></label>
                </div>
            </div>

            <button type="submit" 
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-lg hover:shadow-indigo-500/30 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-150">
                Sign Up
            </button>
        </form>

        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-slate-700/60"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-xs uppercase tracking-wider">or register with</span>
            <div class="flex-grow border-t border-slate-700/60"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button class="flex items-center justify-center py-2.5 px-4 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-lg text-slate-300 text-sm font-medium transition-colors duration-200">
                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google
            </button>
            <button class="flex items-center justify-center py-2.5 px-4 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-lg text-slate-300 text-sm font-medium transition-colors duration-200">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.483 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.479C19.138 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
                </svg>
                GitHub
            </button>
        </div>

        <p class="text-center text-sm text-slate-400 mt-6">
            Already have an account? <a href="login.html" class="text-indigo-400 hover:underline font-medium">Log in</a>
        </p>
    </div>

</body>
</html>
